[project]
dynamic = ["version"]
name = "simplebench"
authors = [
    {name = "Jerilyn Franz", email = "opensource@snowhare.com"}
]
maintainers = [
    {name = "Jerilyn Franz", email = "opensource@snowhare.com"}
]
description = "A powerful and customizable benchmarking framework that is simple to use."
readme = "README.rst"
keywords = ["benchmark", "performance", "framework", "testing"]
license = "Apache-2.0"
license-files = ["LICENSE*"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]

# The package supports Python 3.10+, while development tasks
# like docs and linting are enforced to use a newer version
# via the tox configuration below.
requires-python = ">=3.10"

# TODO: Verify minimum versions of dependencies
dependencies = [
    "numpy>=1.26.4",
    "py-cpuinfo>=9.0.0",
    "simplejson>=3.20.2",
    "rich>=14.1.0",
    "typechecked>=0.11.1",
    "typing-extensions>=4.10.0",
    "typeguard>=4.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simplebench"]
exclude = [
    ".trunk/",
    ".git/",
    ".gitignore",
    "coverage/",
    "MODULE.bazel",
    "BUILD.bazel",
    "WORKSPACE.bazel",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".trunk/",
    ".git/",
    ".gitignore",
    "coverage/",
    "/.github/",
    ".python-version",
    ".readthedocs.yaml",
    "/.vscode/",
    "/coverage/",
    "/coverage_html_report/",
    "/documentation/",
    "/examples/",
    "/docs_source/",
    "python-simplebench.code-workspace",
    "uv.lock",
]
[tool.hatch.version]
path = "src/simplebench/_meta.py"


[tool.mypy]
mypy_path = "src,tests"
warn_unused_ignores = false
warn_redundant_casts = true

[tool.pyright]
include = ["src", "tests", "bench"]
exclude = ["**/node_modules",
    "**/__pycache__",
    "src/experimental",
    "src/typestubs"
]
ignore = []
defineConstant = { DEBUG = true }

reportMissingImports = "error"
reportUnnecessaryIsInstance = false


[project.optional-dependencies]
graphs = [
    "matplotlib>=3.10.6",
    "pandas>=2.2.1",
    "seaborn>=0.13.2",
]
jsonschema = [
    "jsonschema>=4.0.0",
]
pytest = [
    "pytest>=8.4.1,<9.0.0",
    "simplebench[jsonschema]",
]
psutil = [
    "psutil>=7.1.3",
]
all = [
    "simplebench[graphs]",
    "simplebench[jsonschema]",
    "simplebench[psutil]",
    "simplebench[pytest]",
]

[project.urls]
Homepage = "https://github.com/JerilynFranz/python-simplebench"
Documentation = "https://python-simplebench.readthedocs.io/en/latest/"
Repository = "https://github.com/JerilynFranz/python-simplebench.git"
Issues = "https://github.com/JerilynFranz/python-simplebench/issues"
Changelog = "https://github.com/JerilynFranz/python-simplebench/blob/main/CHANGELOG.rst"


[tool.pytest]
minversion = "9.0.0"
testpaths = ["tests"]
norecursedirs = [".git", ".tox", ".vscode", "venv*", ".venv", ".*_cache", "build", "dist", "testplan.py"]
addopts = ["--cov=src", "--cov-report=term-missing", "--cov-report=xml", "--continue-on-collection-errors"]

[tool.pytest.ini_options]
minversion = "8.0.0"
testpaths = ["tests"]
norecursedirs = [".git", ".tox", ".vscode", "venv*", ".venv", ".*_cache", "build", "dist", "testplan.py"]
addopts = """
--cov=src \
--cov-append \
--cov-report html:coverage_html_report \
--cov-report xml:coverage.xml \
--ignore=docs_source/ \
--continue-on-collection-errors
"""

[tool.coverage.run]
branch = true
source = ["simplebench"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about code only used by type checking tools:
    "if TYPE_CHECKING:",
    "def .*: \\.\\.\\.$",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
    ]

ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"

# Configuration for generating a dependency graph
# See https://pypi.org/project/pydeps/
# You may need to install graphviz separately
# (e.g. `brew install graphviz` on macOS, `sudo apt install graphviz` on Debian/Ubuntu)
# Also, you may need to install the `graphviz` Python package
# (e.g. `pip install graphviz` in your development environment)
# The output file will be created at the specified location
# relative to the project root
# run 'pydeps src/simplebench' from the root directory of the project to generate the graph
[tool.pydeps]
format = "svg"
max_bacon = 1
max_cluster_size = 2
max_module_depth = 5
output = "documentation/dependencies.svg"
reverse = true
cluster = true
rankdir = "BT"
no_show = true
verbose = 0
pylib = false
exclude_exact = [
    "simplebench.utils",
    "simplebench.metaclasses",
    "simplebench.si_units",
    "simplebench.exceptions",
    "simplebench.tasks",
    "simplebench.protocols",
    "simplebench.reporters.choices",
    "simplebench.reporters.metaclasses",
    "simplebench.reporters.reporter_option",
    "simplebench.reporters.csv",
    "simplebench.reporters.rich_table",
    "simplebench.reporters.graph",
    "simplebench.reporters.json",
    "simplebench.reporters.interfaces",
    "simplebench.stats",
    "simplebench.constants",
    "simplebench.enums",
    "simplebench.validators",
]

[tool.tox]
requires = ["tox>=4.22"]
env_list = [
    "py310",
    "py311",
    "py312",
    "py313",
    "py314",
    "pypy310",
    "pypy311",
    "lint",
    "doctest",
]
#install_command = ["uv", "pip", "install", "{opts}", "{packages}"]



# NOTE: uv sync resolves across all Python versions allowed by [project].requires-python.
# Docs deps (e.g., Sphinx >= 8.2.3 requires Python >= 3.11), so keep docs deps
# marker-restricted to avoid resolution failures on 3.9–3.10, even when installing only dev.

# The development dependency group requires Python 3.12+ because some tools do not support older versions.
[tool.uv.dependency-groups]
default = {}
dev = {requires-python = ">=3.12"}
docs = {requires-python = ">=3.12"}
#doctest = {requires-python = ">=3.12"}#types = {requires-python = ">=3.12"}
#lint = {requires-python = ">=3.12"}

# labels table for grouping environments
[tool.tox.labels]
test = ["py310", "py311", "py312", "py313", "py314", "pypy310", "pypy311", "doctest", "lint"]

# --- Base Test Environment for automation from env_list ---

[tool.tox.env_run_base]
description = "Run test under {base_python}"
allowlist_externals = ["pytest", "ruff", "mypy", "sphinx-build"]
dependency_groups = ["test", "lint", "tools", "types"]
extras = ["all"]
commands = [
    ["mypy", "src", "tests"],
    ["coverage", "run", "-m", "pytest", "--continue-on-collection-errors", { replace = "posargs", extend = true }],
    ["coverage", "report"],
    ["coverage", "xml", "-o", "coverage.xml"]
]

# --- Concrete Test Environments ---


[tool.tox.env.coverage]
description = "Run tests and generate HTML coverage report"
base_python = ["python3.12", "python3.13", "python3.14"]
dependency_groups = ["test", "tools"]
commands = [
    ["coverage", "run", "-m", "pytest", "--continue-on-collection-errors", {replace = "posargs", extend = true}],
    ["coverage", "html", "-d", "coverage_html_report"],
    ["coverage", "xml"],
    ["coverage", "report"],
]

# mypy excluded from pypy envs due to lack of support

[tool.tox.env.pypy310]
description = "Run tests on PyPy 3.11"
base_python = ["pypy3.11"]
dependency_groups = ["test", "tools"]
commands = [
    ["coverage", "run", "-m", "pytest", { replace = "posargs", extend = true }],
    ["coverage", "report"],
]

[tool.tox.env.pypy311]
description = "Run tests on PyPy 3.11"
base_python = ["pypy3.11"]
dependency_groups = ["test", "tools"]
commands = [
    ["coverage", "run", "-m", "pytest", { replace = "posargs", extend = true }],
    ["coverage", "report"],
]

# tox devenv -e dev
[tool.tox.env.dev]
description = "Development environment with all tools"
package = "editable"
dependency_groups = ["default","dev", "tools", "types", "docs", "lint", "test"]
base = ["testenv"]
base_python = ["python3.12", "python3.11", "python3.13", "python3.14"]
allowlist_externals = ["pytest", "mypy", "ruff", "coverage"]

commands = []

[tool.tox.env.lint]
description = "Run linters"
package = "skip"
base_python = ["python3.12"]
dependency_groups = ["lint", "types", "dev"]
commands = [
    ["ruff", "check", "tests", "src"],
    ["mypy", "src", "tests"],
]

[tool.tox.env.types]
description = "Type checking environment"
package = "skip"
base_python = ["python3.12"]
dependency_groups = ["default", "dev", "tools", "types", "docs", "lint", "test"]
commands = [
    ["mypy", "src", "tests"],
]

[tool.tox.env.docs]
# This environment is self-contained and does NOT inherit from basetest.
description = "Build the documentation"
base_python = ["python3.12"]
dependency_groups = ["docs", "test", "types", "dev"]
extras = ["all"]
allowlist_externals = ["sphinx-build"]
commands = [
    ["sphinx-build", "-b", "html", "docs_source/", "documentation"]
]

[tool.tox.env.doctest]
description = "Run doctests in the documentation"
base_python = ["python3.12"]
dependency_groups = ["docs", "test", "types", "dev"]
allowlist_externals = ["sphinx-build", "pytest"]
extras = ["all"]
commands = [
    ["sphinx-build", "-b", "doctest", "docs_source", "documentation/doctest_output"],
    ["pytest", "documentation/doctest_output", { replace = "posargs", extend = true }],
]

[tool.esbonio.sphinx]
buildArguments = ["sphinx-build", "-M", "html", "docs_source", "${defaultBuildDir}", "--nitpicky", "--verbose"]

[dependency-groups]
# Dependencies for running the test suite
test = [
    "pytest>=8.4.1,<9.0.0",
    "pytest-cov>=6.2.1",
    "coverage>=7.10.6",
    "autopypath>=1.0.1",
    "pytest-mypy-plugins>=3.0.0"
]

# Dependencies for linting and code style
lint = [
    "mypy>=1.17.1",
    "ruff>=0.14.11"
]


# Dependencies for building documentation
docs = [
    "furo>=2025.09.25",
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
]

# A group for all other development tools
tools = [
    "graphviz>=0.21",
    "hatch>=1.13",
    "hatchling>=1.27",
    "mercurial>=6.1",
    "pydeps>=1.23.2",
    "testplan>=25.8.0",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
    "uv>=0.9.18",
]

# Default dependencies for the project. Keep in sync with [project].dependencies and [project.optional-dependencies].
default = [
    "numpy>=1.26.4",
    "py-cpuinfo>=9.0.0",
    "rich>=14.1.0",
    "simplejson>=3.20.2",
    "typechecked>=0.11.1",
    "typing-extensions>=4.10.0",
    "typeguard>=4.4.4",
    "matplotlib>=3.10.6",
    "pandas>=2.2.1",
    "seaborn>=0.13.2",
    "psutil>=7.1.3",
    "jsonschema>=4.0.0",
    "pytest>=8.4.1,<9.0.0",
]

dev = [
    "pytest>=7.4.1,<9.0.0",
    "pytest-cov>=4.2.1",
    "coverage>=6.10.6",
    "mypy>=1.13.1",
    "ruff>=0.14.11",
    "hatch>=1.13",
    "hatchling>=1.27",
    "tox>=4.22.0",
    "tox-uv>=1.13.1",
    "uv>=0.9.18",
    "typing-extensions >= 3.10.0.0",
    "typechecked>=0.11.1",
]

# Type stubs for development and type checking
types = [
    "pandas-stubs>=2.3.2.250827",
    "types-seaborn>=0.13.2.20250809",
    "types-psutil",
    "types-jsonschema",
    "types-simplejson",
]


[project.entry-points.pytest11]
simplebench = "simplebench._pytest"


[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "venv",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venv-tools",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 120
indent-width = 4

# Assume Python 3.10+ syntax.
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["A", "E", "F", "W", "B", "ANN", "UP"]
ignore = ["ANN401"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = true

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.autopypath]
paths = ["src", "tests"]

